name: Pipeline diário Matosinhos

on:
  schedule:
    # Primary data/report cycles in Lisbon time.
    - cron: '30 9 * * *'
      timezone: 'Europe/Lisbon'
    - cron: '0 10 * * *'
      timezone: 'Europe/Lisbon'
    - cron: '30 15 * * *'
      timezone: 'Europe/Lisbon'
    - cron: '0 16 * * *'
      timezone: 'Europe/Lisbon'
    # Recovery slots complete only a missing report and refresh data if needed.
    - cron: '20 10 * * *'
      timezone: 'Europe/Lisbon'
    - cron: '20 16 * * *'
      timezone: 'Europe/Lisbon'
  workflow_dispatch:
    inputs:
      phase:
        description: Fase a executar
        required: true
        default: all
        type: choice
        options:
          - all
          - data
          - report

concurrency:
  group: matosinhos-data-push
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  daily-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Atualizar branch local
        run: git pull --ff-only origin main

      - name: Validar fase local
        id: gate
        shell: bash
        run: |
          local_date="$(TZ=Europe/Lisbon date +'%Y-%m-%d')"
          local_time="$(TZ=Europe/Lisbon date +'%H:%M')"
          schedule="${{ github.event.schedule }}"

          phase=""
          cycle=""
          scheduled_local_time=""
          recovery="false"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            phase="${{ inputs.phase }}"
            cycle="manual-${{ github.run_id }}"
            scheduled_local_time="$local_time"
          else
            case "$schedule" in
              "30 9 * * *")
                phase="data"
                cycle="morning"
                scheduled_local_time="09:30"
                ;;
              "0 10 * * *")
                phase="report"
                cycle="morning"
                scheduled_local_time="10:00"
                ;;
              "30 15 * * *")
                phase="data"
                cycle="afternoon"
                scheduled_local_time="15:30"
                ;;
              "0 16 * * *")
                phase="report"
                cycle="afternoon"
                scheduled_local_time="16:00"
                ;;
              "20 10 * * *")
                phase="report"
                cycle="morning"
                scheduled_local_time="10:20"
                recovery="true"
                ;;
              "20 16 * * *")
                phase="report"
                cycle="afternoon"
                scheduled_local_time="16:20"
                recovery="true"
                ;;
            esac
          fi

          if [ -z "$phase" ] || [ -z "$cycle" ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Fora das fases operacionais: local=${local_date} ${local_time}; scheduled_local=${scheduled_local_time}; schedule='${schedule}'."
            exit 0
          fi

          cycle_id="${local_date}-${cycle}"
          marker_id="${cycle_id}-${phase}"
          marker_path="data/workflow_run_markers.csv"
          if [ "$phase" != "all" ] &&
             [ -f "$marker_path" ] &&
             grep -q "^${marker_id}," "$marker_path"; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Fase ${marker_id} já executada."
            exit 0
          fi

          echo "should_run=true" >> "$GITHUB_OUTPUT"
          echo "phase=${phase}" >> "$GITHUB_OUTPUT"
          echo "cycle=${cycle}" >> "$GITHUB_OUTPUT"
          echo "cycle_id=${cycle_id}" >> "$GITHUB_OUTPUT"
          echo "marker_id=${marker_id}" >> "$GITHUB_OUTPUT"
          echo "local_date=${local_date}" >> "$GITHUB_OUTPUT"
          echo "scheduled_local_time=${scheduled_local_time}" >> "$GITHUB_OUTPUT"
          echo "recovery=${recovery}" >> "$GITHUB_OUTPUT"
          echo "A executar fase ${phase} do ciclo ${cycle_id}; arranque ${local_time} Europe/Lisbon; horário=${scheduled_local_time}; recuperação=${recovery}; schedule='${schedule}'."

      - uses: r-lib/actions/setup-r@v2
        if: steps.gate.outputs.should_run == 'true'
        with:
          r-version: 'release'

      - name: Instalar packages R
        if: steps.gate.outputs.should_run == 'true'
        run: |
          install.packages(c("httr", "jsonlite", "dplyr", "readr"))
        shell: Rscript {0}

      - name: Atualizar dados externos
        if: steps.gate.outputs.should_run == 'true'
        shell: bash
        run: |
          marker_path="data/workflow_run_markers.csv"
          data_marker="${{ steps.gate.outputs.cycle_id }}-data"
          phase="${{ steps.gate.outputs.phase }}"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] &&
             [ "$phase" = "report" ]; then
            echo "Execução manual report: a usar os dados já disponíveis."
            exit 0
          fi

          if [ "$phase" = "report" ] &&
             [ -f "$marker_path" ] &&
             grep -q "^${data_marker}," "$marker_path"; then
            echo "Dados já atualizados para ${data_marker}; a avançar para relatório."
            exit 0
          fi

          if [ "$phase" = "data" ] || [ "$phase" = "report" ] || [ "$phase" = "all" ]; then
            Rscript run_daily_pipeline.R "${{ steps.gate.outputs.cycle_id }}" data
          fi

      - name: Gerar relatório diário
        if: steps.gate.outputs.should_run == 'true' && (steps.gate.outputs.phase == 'report' || steps.gate.outputs.phase == 'all')
        run: Rscript run_daily_pipeline.R "${{ steps.gate.outputs.cycle_id }}" report

      - name: Testar indicadores e lógica do relatório
        if: steps.gate.outputs.should_run == 'true' && (steps.gate.outputs.phase == 'report' || steps.gate.outputs.phase == 'all')
        run: |
          Rscript tests/test_dsp_rules.R
          Rscript tests/test_report_summary.R
          Rscript tests/test_tropical_nights.R
          Rscript tests/test_bathing_water.R
          Rscript tests/test_temperature_forecast_comparison.R
          Rscript tests/test_temperature_source_comparison.R
          Rscript tests/test_report_monitoring.R

      - name: Validar relatório diário
        if: steps.gate.outputs.should_run == 'true' && (steps.gate.outputs.phase == 'report' || steps.gate.outputs.phase == 'all')
        shell: bash
        run: |
          report_path="daily/${{ steps.gate.outputs.local_date }}.md"
          quick_report_path="daily/resumo/${{ steps.gate.outputs.local_date }}.md"
          expected_title="# PNPRSS Matosinhos | ${{ steps.gate.outputs.local_date }}"

          for path in "$report_path" "$quick_report_path"; do
            if [ ! -s "$path" ]; then
              echo "::error::Relatório ausente ou vazio: ${path}"
              exit 1
            fi

            actual_title="$(head -n 1 "$path")"
            if [ "$actual_title" != "$expected_title" ]; then
              echo "::error::Título inesperado em ${path}: ${actual_title}"
              exit 1
            fi
          done

          echo "Relatórios validados: ${report_path}, ${quick_report_path}"

      - name: Marcar fase concluída
        if: steps.gate.outputs.should_run == 'true'
        shell: bash
        run: |
          marker_path="data/workflow_run_markers.csv"
          mkdir -p data
          if [ ! -f "$marker_path" ]; then
            echo "cycle_id,completed_at_utc" > "$marker_path"
          fi

          add_marker() {
            marker="$1"
            if ! grep -q "^${marker}," "$marker_path"; then
              echo "${marker},$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$marker_path"
            fi
          }

          phase="${{ steps.gate.outputs.phase }}"
          if [ "$phase" = "data" ]; then
            add_marker "${{ steps.gate.outputs.cycle_id }}-data"
          elif [ "$phase" = "report" ]; then
            if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
              add_marker "${{ steps.gate.outputs.cycle_id }}-data"
            fi
            add_marker "${{ steps.gate.outputs.cycle_id }}-report"
          elif [ "$phase" = "all" ]; then
            add_marker "${{ steps.gate.outputs.cycle_id }}-data"
            add_marker "${{ steps.gate.outputs.cycle_id }}-report"
          fi

      - name: Commit das alterações se mudaram
        id: publish
        if: steps.gate.outputs.should_run == 'true'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ daily/ qualar_matosinhos.csv
          if git diff --staged --quiet; then
            echo "Sem alterações nos dados, relatório ou marcadores, nada a fazer."
          else
            git commit -m "Run Matosinhos ${{ steps.gate.outputs.phase }} pipeline $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                exit 0
              fi

              if [ "$attempt" -lt 3 ]; then
                wait_seconds=$((attempt * 10))
                echo "Push falhou na tentativa ${attempt}; nova tentativa em ${wait_seconds}s."
                sleep "$wait_seconds"
              fi
            done

            echo "::error::Não foi possível publicar após três tentativas."
            exit 1
          fi

      - name: Preservar outputs se a publicação falhou
        if: steps.publish.outcome == 'failure'
        uses: actions/upload-artifact@v6
        with:
          name: matosinhos-${{ steps.gate.outputs.cycle_id }}-${{ steps.gate.outputs.phase }}
          path: |
            data/
            daily/
            qualar_matosinhos.csv
          if-no-files-found: warn
          retention-days: 7

      - name: Assinalar falha de publicação
        if: steps.publish.outcome == 'failure'
        run: |
          echo "::error::Os outputs foram preservados como artifact, mas não foram publicados em main."
          exit 1
