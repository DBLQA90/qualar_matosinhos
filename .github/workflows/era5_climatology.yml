name: Climatologia ERA5-Land Matosinhos

on:
  workflow_dispatch:

concurrency:
  group: matosinhos-data-push
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  era5-climatology:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Atualizar branch local
        run: git pull --ff-only origin main

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Instalar cliente CDS
        run: python -m pip install --upgrade cdsapi

      - name: Configurar CDS API por ficheiro
        shell: bash
        env:
          CDSAPI_RC: ${{ secrets.CDSAPI_RC }}
        run: |
          if [ -n "$CDSAPI_RC" ]; then
            printf '%s\n' "$CDSAPI_RC" > ~/.cdsapirc
            chmod 600 ~/.cdsapirc
          else
            echo "Sem secret CDSAPI_RC; serão usadas CDSAPI_URL/CDSAPI_KEY se existirem."
          fi

      - name: Extrair climatologia e percentis ERA5-Land
        env:
          CDSAPI_URL: ${{ secrets.CDSAPI_URL }}
          CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
        run: Rscript fetch_era5_temperature_climatology.R all

      - name: Validar climatologia gerada
        shell: bash
        run: |
          for file in \
            data/era5_matosinhos_daily_temperature_1991_2020.csv \
            data/era5_matosinhos_temperature_percentiles.csv \
            data/era5_matosinhos_temperature_percentile_alerts.csv \
            data/era5_matosinhos_temperature_percentile_alert_latest.csv; do
            if [ ! -s "$file" ]; then
              echo "::error::Ficheiro ERA5-Land ausente ou vazio: ${file}"
              exit 1
            fi
          done

      - name: Commit da climatologia se mudou
        id: publish
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for file in \
            data/era5_matosinhos_daily_temperature_1991_2020.csv \
            data/era5_matosinhos_temperature_percentiles.csv \
            data/era5_matosinhos_temperature_percentile_alerts.csv \
            data/era5_matosinhos_temperature_percentile_alert_latest.csv; do
            if [ -f "$file" ]; then
              git add "$file"
            fi
          done
          if git diff --staged --quiet; then
            echo "Sem alterações ERA5-Land, nada a fazer."
          else
            git commit -m "Update ERA5-Land Matosinhos climatology $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                exit 0
              fi

              if [ "$attempt" -lt 3 ]; then
                wait_seconds=$((attempt * 10))
                echo "Push falhou na tentativa ${attempt}; nova tentativa em ${wait_seconds}s."
                sleep "$wait_seconds"
              fi
            done

            echo "::error::Não foi possível publicar após três tentativas."
            exit 1
          fi

      - name: Preservar climatologia se a publicação falhou
        if: steps.publish.outcome == 'failure'
        uses: actions/upload-artifact@v6
        with:
          name: era5-land-matosinhos-${{ github.run_id }}
          path: |
            data/era5_matosinhos_daily_temperature_1991_2020.csv
            data/era5_matosinhos_temperature_percentiles.csv
            data/era5_matosinhos_temperature_percentile_alerts.csv
            data/era5_matosinhos_temperature_percentile_alert_latest.csv
          if-no-files-found: error
          retention-days: 7

      - name: Assinalar falha de publicação
        if: steps.publish.outcome == 'failure'
        run: |
          echo "::error::A climatologia foi preservada como artifact, mas não foi publicada em main."
          exit 1
